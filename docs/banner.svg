<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="Segoe UI Variable Text, Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <radialGradient id="lit" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#ffe1a8"/><stop offset=".55" stop-color="#f2a93b"/></radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="#0f1012"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- logo: IC package with a lit indicator -->
  <g transform="translate(80 96)" stroke="#ececee" stroke-width="5" stroke-linecap="round" fill="none">
    <rect x="22" y="22" width="68" height="68" rx="15"/>
    <path d="M40 4v18M72 4v18M40 90v18M72 90v18M4 40h18M4 72h18M90 40h18M90 72h18"/>
    <circle cx="56" cy="56" r="12" fill="url(#lit)" stroke="none"/>
  </g>

  <text x="236" y="160" font-size="62" font-weight="700" fill="#ececee" letter-spacing="-1.8">Komponent Depo</text>
  <text x="238" y="206" font-size="24" fill="#a8a8b0">Inventory for electronic parts. Photos found by name,</text>
  <text x="238" y="238" font-size="24" fill="#a8a8b0">projects, QR labels. One HTML file, no account.</text>

  <!-- readout strip -->
  <g transform="translate(238 272)" font-size="15" fill="#8f8f99">
    <rect width="600" height="48" rx="10" fill="#141517" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="22" cy="24" r="5" fill="#3ecf8e"/><text x="36" y="29" fill="#ececee" font-weight="600">130</text><text x="72" y="29">pieces</text>
    <path d="M150 12v24" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="172" cy="24" r="5" fill="#f28c3b"/><text x="186" y="29" fill="#ececee" font-weight="600">2</text><text x="202" y="29">low</text>
    <path d="M254 12v24" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="276" cy="24" r="5" fill="#f0506e"/><text x="290" y="29" fill="#ececee" font-weight="600">1</text><text x="304" y="29">out</text>
    <path d="M354 12v24" stroke="#ffffff" stroke-opacity=".1"/>
    <g transform="translate(376 20)"><rect width="18" height="8" rx="2" fill="#3ecf8e"/><rect x="22" width="18" height="8" rx="2" fill="#3ecf8e"/><rect x="44.75" y=".75" width="16.5" height="6.5" rx="1.5" fill="none" stroke="#f0506e" stroke-width="1.5"/><rect x="66" width="18" height="8" rx="2" fill="#3ecf8e"/></g>
    <text x="474" y="29">robot: 3 / 4</text>
  </g>

  <!-- right: languages + key hint -->
  <g font-size="15" fill="#8f8f99" text-anchor="end">
    <text x="1200" y="72">EN · TR · DE</text>
  </g>
  <g transform="translate(1068 282)" font-family="Cascadia Mono, SF Mono, Consolas, monospace" font-size="15" fill="#a8a8b0">
    <rect width="76" height="34" rx="7" fill="#1f2024" stroke="#ffffff" stroke-opacity=".12"/><text x="38" y="22" text-anchor="middle">Ctrl K</text>
  </g>
  <rect x="1156" y="282" width="44" height="34" rx="9" fill="#f2a93b"/>
  <path d="M1178 291v16M1170 299h16" stroke="#1c1304" stroke-width="2.5" stroke-linecap="round"/>
</svg>
