  <text x="196" y="150" font-size="64" font-weight="800" fill="#f3f0ff" letter-spacing="-1.5">Komponent <tspan fill="url(#g)">Depo</tspan></text>
  <text x="82" y="232" font-size="27" fill="#b3abd6">Count, find and restock your electronic parts.</text>
