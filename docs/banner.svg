    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b4a5ff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
