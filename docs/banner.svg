    <path d="M880 70h90l30 30h120"/><path d="M900 290h70l40-40h150"/><path d="M1000 180h180"/>
  </g>
  <g fill="#22d3ee"><circle cx="1120" cy="100" r="7"/><circle cx="1160" cy="250" r="7"/><circle cx="1180" cy="180" r="7"/></g>
  <g fill="#8b5cf6"><circle cx="880" cy="70" r="7"/><circle cx="900" cy="290" r="7"/><circle cx="1000" cy="180" r="7"/></g>
  <!-- çip -->
